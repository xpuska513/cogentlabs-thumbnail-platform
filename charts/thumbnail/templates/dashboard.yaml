{{- if .Values.monitoring.enabled }}
# Picked up by Grafana's dashboard sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "thumbnail.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  thumbnail.json: |
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
