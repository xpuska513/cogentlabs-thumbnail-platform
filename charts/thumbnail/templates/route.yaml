{{- if .Values.gateway.enabled }}
# Standard Gateway API: works with any implementation, in the cloud or on-prem.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "thumbnail.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-api
          port: 3000
      timeouts:
        request: {{ .Values.gateway.requestTimeout }}
{{- if .Values.gateway.envoyUploadLimit }}
---
# Envoy Gateway extension: buffer each upload at the gateway and reject it
# with 413 above the limit. The app itself accepts any size into memory.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "thumbnail.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}-api
  requestBuffer:
    limit: {{ .Values.gateway.envoyUploadLimit }}
{{- end }}
{{- end }}
