{{- $selector := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "thumbnail.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "thumbnail.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "thumbnail.selectorLabels" $selector | nindent 8 }}
      annotations:
        checksum/scripts: {{ include "thumbnail.scriptsChecksum" . }}
    spec:
      securityContext:
        {{- include "thumbnail.podSecurityContext" . | nindent 8 }}
      {{- include "thumbnail.spread" $selector | nindent 6 }}
      # 5 s preStop pause + time to finish requests. The app doesn't handle
      # SIGTERM (and running node as PID 1 means it ignores it), so the pod is
      # killed when this runs out.
      terminationGracePeriodSeconds: 15
      initContainers:
        {{- include "thumbnail.initContainers" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "thumbnail.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Instead of `npm start`: with npm as PID 1, NODE_OPTIONS loads the
          # instrumentation into npm too, and npm takes the metrics port.
          command: ["node", "dist/index.js"]
          env:
            - name: SERVER_TYPE
              value: server
            {{- include "thumbnail.connectionEnv" . | nindent 12 }}
            {{- include "thumbnail.otelEnv" (dict "root" . "service" "thumbnail-api" "traces" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
            {{- if .Values.otel.enabled }}
            - name: metrics
              containerPort: 9464
            {{- end }}
          # GET / is static: it shows the process serves HTTP, not that MongoDB
          # or MinIO work. Tying readiness to them would take every pod out at
          # once during a dependency outage, so the prober and alerts cover that.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Keep serving while the endpoint removal propagates to the gateway.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "thumbnail.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "thumbnail.appVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "thumbnail.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "thumbnail.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "thumbnail.selectorLabels" $selector | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- if gt (int .Values.api.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "thumbnail.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  # A pod that isn't ready (the API crash-looping while MongoDB is down) can
  # still be evicted, so it doesn't block a node drain.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "thumbnail.selectorLabels" $selector | nindent 6 }}
{{- end }}
