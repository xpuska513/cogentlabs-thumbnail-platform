# Single MongoDB instance for development. It stands in for a managed service
# (Atlas, DocumentDB) in the cloud or an operator-run replica set on-prem; the
# app only needs a connection string, so swapping it doesn't touch the chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: thumbnail
data:
  # Runs once, on first start with an empty data directory.
  create-users.js: |
    db.getSiblingDB('thumbnails').createUser({
      user: 'thumbnail',
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: 'readWrite', db: 'thumbnails' }],
    });
    db.getSiblingDB('admin').createUser({
      user: 'exporter',
      pwd: process.env.MONGO_EXPORTER_PASSWORD,
      roles: [{ role: 'clusterMonitor', db: 'admin' }, { role: 'read', db: 'local' }],
    });
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: thumbnail
  labels:
    app.kubernetes.io/name: mongodb
spec:
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: thumbnail
  labels:
    app.kubernetes.io/name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:8.0.34
          # Cap the cache explicitly: by default it is sized from the node's
          # memory, not the container limit.
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: thumbnail-credentials, key: mongo-root-password }
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: thumbnail-credentials, key: mongo-app-password }
            - name: MONGO_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef: { name: thumbnail-credentials, key: mongo-exporter-password }
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: mongodb-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
