# Single-node MinIO for development, same image as the app's docker-compose.
# It stands in for S3 in the cloud or a replicated object store on-prem; the
# app only needs an endpoint and credentials.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: thumbnail
  labels:
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: thumbnail
  labels:
    app.kubernetes.io/name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          # The default certs dir is under $HOME, which this non-root user can't write.
          args: ["server", "/data", "--certs-dir", "/tmp/certs"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: thumbnail-credentials, key: minio-root-user }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: thumbnail-credentials, key: minio-root-password }
            # Metrics without a bearer token. Acceptable here because the port is
            # only reachable inside the cluster; production should use a token.
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio
  namespace: thumbnail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  # Two paths on one port. Without a label telling them apart, both scrapes
  # write the same `up` series and its value flaps if only one of them fails.
  endpoints:
    - port: s3
      path: /minio/v2/metrics/cluster
      relabelings:
        - { targetLabel: metrics, replacement: cluster }
    - port: s3
      path: /minio/v2/metrics/bucket
      relabelings:
        - { targetLabel: metrics, replacement: bucket }
