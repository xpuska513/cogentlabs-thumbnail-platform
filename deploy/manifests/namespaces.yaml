apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: thumbnail
  labels:
    # Lets HTTPRoutes in this namespace attach to the shared public Gateway.
    gateway-access: public
    # Enforce the baseline Pod Security standard, warn on anything short of restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
