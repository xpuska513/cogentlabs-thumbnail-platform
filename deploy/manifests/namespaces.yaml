apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: thumbnail
  labels:
    # Lets HTTPRoutes in this namespace attach to the shared public Gateway.
    gateway-access: public
    # Every pod here (app, prober, MongoDB, MinIO, exporter) meets the strictest
    # Pod Security standard, so enforce it: a pod that doesn't is rejected.
    pod-security.kubernetes.io/enforce: restricted
