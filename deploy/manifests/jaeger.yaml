# Jaeger all-in-one with in-memory storage: enough for a dev cluster.
# Traces are lost on restart; production would use Tempo or Jaeger with
# object storage. Receives OTLP from the gateway and the API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: monitoring
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
    extensions:
      jaeger_query:
        storage:
          traces: memstore
        http:
          endpoint: 0.0.0.0:16686
        grpc:
          endpoint: 0.0.0.0:16685
      jaeger_storage:
        backends:
          memstore:
            memory:
              # Bounds memory use: oldest traces are dropped first.
              max_traces: 20000
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      jaeger_storage_exporter:
        trace_storage: memstore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
      annotations:
        # Restart on config change.
        config-version: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          args: ["--config", "/etc/jaeger/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
            - { name: health, containerPort: 13133 }
          readinessProbe:
            httpGet:
              path: /status
              port: health
          livenessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
      volumes:
        - name: config
          configMap:
            name: jaeger-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: ui, port: 16686, targetPort: ui }
---
# The gateway's EnvoyProxy (in envoy-gateway-system) sends traces here.
# Gateway API requires the target namespace to allow that reference.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: envoy-traces-to-jaeger
  namespace: monitoring
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Service
      name: jaeger
